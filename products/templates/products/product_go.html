<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting… {{ product.title }}</title>
  <!-- Fallback for browsers with JS off: redirect after 2s -->
  <meta http-equiv="refresh" content="2;url={{ amazon_url }}">
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:#fff;color:#111;display:flex;min-height:100vh;
         align-items:center;justify-content:center;text-align:center;padding:24px}
    .card{max-width:340px}
    .card img{width:150px;height:150px;object-fit:contain;margin-bottom:16px}
    .title{font-size:15px;line-height:1.4;margin-bottom:14px;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .spin{width:34px;height:34px;border:3px solid #eee;border-top-color:#febd69;
          border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    .muted{font-size:13px;color:#888;margin-bottom:16px}
    .btn{display:inline-block;background:#febd69;color:#111;text-decoration:none;
         font-weight:600;padding:11px 20px;border-radius:8px;font-size:14px}
  </style>
</head>
<body>
  <div class="card">
    {% if product.image_url %}<img src="{{ product.image_url }}" alt="">{% endif %}
    <div class="title">{{ product.title }}</div>
    <div class="spin"></div>
    <div class="muted">Taking you to Amazon…</div>
    <!-- This anchor is BOTH the manual fallback and the source JS reads from -->
    <a id="go" class="btn" href="{{ amazon_url }}" rel="nofollow noopener">Buy Now on Amazon</a>
  </div>

  <script>
    var el  = document.getElementById('go');
    var dest = el.href;                       // browser already parsed the URL correctly
    setTimeout(function () {
      window.location.replace(dest);          // replace() = doesn't add a back-button trap
    }, {{ delay_ms }});
  </script>
</body>
</html>
